<!doctype html><html><head><meta charset="utf-8">
<!-- Vídeo curto de apresentação da app (1080x1920). A app corre dentro do "telemóvel" (iframe de index.html)
     e é comandada daqui: começar, estante, línguas, uma história com toques. Copiado para dist/teste/ ao gravar. -->
<style>
@font-face{font-family:G;src:url(fonts/grandstander-latin-800-normal.woff2) format('woff2');font-weight:800}
@font-face{font-family:A;src:url(fonts/andika-latin-400-normal.woff2) format('woff2')}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{background:linear-gradient(#8fd0f2,#fdf0cf 70%,#bfe3a0);font-family:A,sans-serif;color:#2b2140}
#cap{position:absolute;left:40px;right:40px;top:70px;height:190px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:G,sans-serif;font-weight:800;font-size:78px;line-height:1.05;transition:opacity .35s,transform .35s;text-shadow:0 4px 0 #fff8}
#cap.out{opacity:0;transform:translateY(-14px)}
#phone{position:absolute;left:136px;top:300px;width:780px;height:1560px;border:14px solid #2b2140;border-radius:84px;overflow:hidden;background:#000;box-shadow:0 24px 60px #0004}
#app{width:390px;height:780px;border:0;transform:scale(2);transform-origin:0 0;display:block}
.dot{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:#fff7;border:6px solid #fff;box-shadow:0 0 0 4px #2b214055;pointer-events:none;animation:tapd .7s ease-out forwards;z-index:5}
@keyframes tapd{0%{transform:scale(.4);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(1.5);opacity:0}}
#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;background:linear-gradient(#bfe4f6,#fdf3d6);opacity:0;transition:opacity .6s;text-align:center;z-index:8}
#end.on{opacity:1}
#end img{width:380px;height:380px;border-radius:90px;box-shadow:0 14px 40px #0003}
#end h2{font-family:G;font-weight:800;font-size:96px;margin:0}
#end p{font-size:50px;margin:0 90px;line-height:1.3}
#end b{font-family:G;font-size:54px;background:#2b2140;color:#fff;border-radius:99px;padding:22px 60px}
#wait{position:absolute;inset:0;background:#000;z-index:9}
</style></head><body>
<div id="cap"></div>
<div id="phone"><iframe id="app" src="index.html?video=1"></iframe></div>
<div id="end"><img src="icon-512.png" alt=""><h2>Ovelhinha</h2><p id="e2"></p><b id="e3"></b></div>
<div id="wait"></div>
<script>
const Q=new URLSearchParams(location.search), lang=Q.get('lang')||'pt';
const TXT={
  pt:{a:'Histórias da Bíblia para crianças', b:'35 histórias animadas', c:'Em 4 línguas', d:'Toca e a história ganha vida!', e2:'Livros animados da Bíblia para ler e tocar.', e3:Q.get('fim')||'Grátis no Google Play'},
  es:{a:'Historias de la Biblia para niños', b:'35 historias animadas', c:'En 4 idiomas', d:'¡Toca y la historia cobra vida!', e2:'Libros animados de la Biblia para leer y tocar.', e3:Q.get('fim')||'Gratis en Google Play'},
  fr:{a:'Histoires de la Bible pour enfants', b:'35 histoires animées', c:'En 4 langues', d:'Touche, et l’histoire s’anime !', e2:'Des livres animés de la Bible à lire et à toucher.', e3:Q.get('fim')||'Gratuit sur Google Play'},
  en:{a:'Bible stories for kids', b:'35 animated stories', c:'In 4 languages', d:'Tap and the story comes alive!', e2:'Animated Bible books to read and tap.', e3:Q.get('fim')||'Free on Google Play'}
}[lang];
e2.textContent=TXT.e2; e3.textContent=TXT.e3;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
window.LOG=[]; let T0=0;
const W=()=>document.getElementById('app').contentWindow, D=()=>W().document;
async function caption(t){ const c=document.getElementById('cap'); c.classList.add('out'); await sleep(300); c.textContent=t; c.classList.remove('out'); }
// toque visível (círculo branco) e clique no elemento da app
function tap(el, ev){
  if(!el) return;
  const r=el.getBoundingClientRect(), ph=document.getElementById('phone');
  const x=136+14+(r.left+r.width/2)*2, y=300+14+(r.top+r.height/2)*2;
  const d=document.createElement('div'); d.className='dot'; d.style.left=x+'px'; d.style.top=y+'px'; document.body.appendChild(d); setTimeout(()=>d.remove(),900);
  if(ev) el.dispatchEvent(new (W().MouseEvent)('click',{bubbles:true})); else el.click();
}
async function scrollTo(el, top, ms){ const a=el.scrollTop, n=Math.max(1,Math.round(ms/33)); for(let i=1;i<=n;i++){ const k=i/n, e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2; el.scrollTop=a+(top-a)*e; await sleep(33);} }
const flag=l=>[...D().querySelectorAll('.flag')].filter(f=>f.offsetParent).find(f=>(f.getAttribute('aria-label')||'')===({pt:'Português',es:'Español',fr:'Français',en:'English'})[l]);
async function tapScene(ms, every=900){ const end=performance.now()+ms; let k=0; while(performance.now()<end-300){ const ts=[...D().querySelectorAll('.tap')].filter(e=>{const r=e.getBoundingClientRect(); return r.width>0&&r.top>40&&r.top<700;}); if(ts.length) tap(ts[k++%ts.length], true); await sleep(every);} }
(async()=>{
  const fr=document.getElementById('app');
  await new Promise(r=>{ if(fr.contentDocument&&fr.contentDocument.readyState==='complete') r(); else fr.addEventListener('load',r); });
  await sleep(1200);
  // os sons da app ficam registados para o áudio do vídeo
  W().eval("Sound.play=(n,...a)=>{ parent.LOG.push({t:(parent.performance.now()-parent.__T0)/1000,name:n,a}); }");
  if(flag(lang)) flag(lang).click();
  await D().fonts.ready; await sleep(600);
  window.READY=true; while(!window.GO) await sleep(40);
  document.getElementById('wait').remove(); T0=window.__T0=performance.now();
  // 1. a app abre
  await caption(TXT.a); await sleep(1500);
  tap(D().getElementById('startBtn')); await sleep(900);
  // 2. a estante com todas as histórias
  await caption(TXT.b);
  const sh=D().getElementById('shelfView');
  await scrollTo(sh, sh.scrollHeight-sh.clientHeight, 4200); await sleep(300);
  await scrollTo(sh, 0, 900); await sleep(200);
  // 3. as línguas: a estante muda de língua
  await caption(TXT.c);
  for (const l of ['es','fr','en',lang]) { tap(flag(l)); await sleep(1150); }
  // 4. uma história com toques
  await caption(TXT.d);
  const card=D().querySelector('[data-book=moises]');
  await scrollTo(sh, card.offsetTop-120, 700); await sleep(150);
  tap(card); await sleep(1500);
  W().eval('Book.go(10)'); await sleep(900);
  await tapScene(4200, 1000);
  tap(D().getElementById('next')); await sleep(1000);
  await tapScene(3200, 900);
  // 5. fim
  document.getElementById('cap').classList.add('out');
  document.getElementById('end').classList.add('on'); await sleep(3600);
  window.DONE=(performance.now()-T0)/1000;
})();
</script></body></html>
